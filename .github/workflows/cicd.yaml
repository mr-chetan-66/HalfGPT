name: Deploy FastAPI Docker Image to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::032397977896:role/halfgpt-github-actions-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: halfgpt
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Building image: $IMAGE_URI"

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::032397977896:role/halfgpt-github-actions-role
          aws-region: ap-south-1

      - name: Deploy to EC2 through Systems Manager
        env:
          AWS_DEFAULT_REGION: ap-south-1
          ECR_REPO: halfgpt
          EC2_INSTANCE_ID: i-002298c0aef0e4c2b
          APP_SECRET_ID: halfgpt/prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
          export ECR_REGISTRY IMAGE_URI

          PARAMETERS=$(python3 - <<'PY'
          import json
          import os
          import shlex

          region = os.environ['AWS_DEFAULT_REGION']
          registry = os.environ['ECR_REGISTRY']
          image = os.environ['IMAGE_URI']
          secret_id = os.environ['APP_SECRET_ID']
          commands = [
              'set -euo pipefail',
              'mountpoint -q /mnt/halfgpt || { echo "EBS volume is not mounted at /mnt/halfgpt"; exit 1; }',
              'mkdir -p /mnt/halfgpt/data /mnt/halfgpt/chroma_db /mnt/halfgpt/uploads',
              f'aws ecr get-login-password --region {shlex.quote(region)} | docker login --username AWS --password-stdin {shlex.quote(registry)}',
              f'docker pull {shlex.quote(image)}',
              f'aws secretsmanager get-secret-value --secret-id {shlex.quote(secret_id)} --query SecretString --output text > /mnt/halfgpt/app.env',
              'chmod 600 /mnt/halfgpt/app.env',
              'docker stop agentic-chatbot || true',
              'docker rm agentic-chatbot || true',
              f'docker run -d --name agentic-chatbot --restart always -p 8080:8080 -v /mnt/halfgpt/data:/app/data -v /mnt/halfgpt/chroma_db:/app/chroma_db -v /mnt/halfgpt/uploads:/app/uploads --env-file /mnt/halfgpt/app.env {shlex.quote(image)}',
              'for attempt in $(seq 1 30); do if curl -fsS http://localhost:8080/ >/dev/null; then exit 0; fi; sleep 2; done',
              'docker logs --tail 100 agentic-chatbot',
              'exit 1'
          ]
          print(json.dumps({'commands': commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy HalfGPT $GITHUB_SHA" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

      - name: Clean unused Docker images
        run: |
          docker image prune -f